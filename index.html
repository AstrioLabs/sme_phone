<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PhoneStore iPhone 18</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
/* Layout: one phone-width column — frosted see-through shell, solid white cards, one bottom sheet that steps from options to form */
:root {
  --ground: #e9ecf3;
  --blob-a: #b9c8ff;
  --blob-b: #f5c6e6;
  --glass: rgba(255, 255, 255, 0.42);
  --glass-edge: rgba(255, 255, 255, 0.75);
  --card: #ffffff;
  --ink: #17181d;
  --muted: #6c6f7b;
  --line: #e3e5ec;
  --field: #f6f7fa;
  --accent: #2f6bff;
  --ok: #22c55e;
  --font: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; font-family: var(--font); color: var(--ink); background: var(--ground);
  background-image: radial-gradient(40rem 30rem at 10% 10%, var(--blob-a), transparent 60%), radial-gradient(36rem 30rem at 95% 70%, var(--blob-b), transparent 60%);
  background-attachment: fixed; -webkit-tap-highlight-color: transparent;
}
.shell {
  max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column;
  background: var(--glass); backdrop-filter: blur(18px) saturate(1.2); -webkit-backdrop-filter: blur(18px) saturate(1.2);
  border-left: 1px solid var(--glass-edge); border-right: 1px solid var(--glass-edge);
}
.shell > * { transition: opacity .4s ease; }
.shell.done > * { opacity: 0; pointer-events: none; }
header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; justify-content: space-between;
  padding-block: 14px;
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
  background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--glass-edge);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: rgba(255,255,255,0.6); }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.15rem; letter-spacing: -0.01em; }
.logo i { width: 14px; height: 24px; border-radius: 4px; background: var(--ink); box-shadow: inset 0 0 0 3px var(--ink), inset 0 0 0 5px #4a4c55; display: block; }
.icons { display: flex; gap: 6px; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 0; background: transparent; display: grid; place-items: center; color: var(--ink); cursor: pointer; }
.icon-btn svg { width: 22px; height: 22px; }
button:focus-visible, .card:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

main {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  padding-block: 28px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.carousel { position: relative; width: 100%; max-width: 400px; }
.frame { background: var(--card); border-radius: 28px; box-shadow: 0 18px 40px rgba(30, 35, 70, 0.14), 0 2px 6px rgba(30, 35, 70, 0.06); }
.viewport { overflow: hidden; border-radius: 28px; touch-action: pan-y; }
.track { display: flex; transition: transform 0.45s cubic-bezier(.2,.8,.2,1); }
.card {
  flex: 0 0 100%; padding: 28px 24px 22px; display: flex; flex-direction: column; align-items: center; gap: 10px;
  cursor: pointer; user-select: none; position: relative; background: var(--card);
}
.card img { width: 78%; max-width: 280px; height: auto; aspect-ratio: 5 / 6; object-fit: contain; mix-blend-mode: multiply; pointer-events: none; transition: transform .2s; }
.card:active img { transform: scale(0.97); }
.badge { position: absolute; top: 16px; left: 16px; background: var(--ink); color: #fff; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.12em; padding: 6px 10px; border-radius: 999px; }
.name { font-weight: 800; font-size: 1.15rem; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
.dot { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); flex: none; }
.arrow {
  position: absolute; top: 46%; transform: translateY(-50%); width: 46px; height: 46px; border-radius: 50%; border: 0; cursor: pointer;
  display: grid; place-items: center; z-index: 2; box-shadow: 0 6px 16px rgba(30,35,70,.18); transition: transform .15s;
}
.arrow:active { transform: translateY(-50%) scale(0.92); }
.arrow.prev { left: -10px; background: var(--card); color: var(--ink); }
.arrow.next { right: -10px; background: var(--ink); color: #fff; }
.arrow svg { width: 20px; height: 20px; }
.dots { display: flex; justify-content: center; gap: 7px; margin-top: 16px; }
.dots button { width: 8px; height: 8px; border-radius: 99px; border: 0; padding: 0; background: rgba(23,24,29,.22); cursor: pointer; transition: width .25s, background .25s; }
.dots button[aria-current="true"] { width: 22px; background: var(--ink); }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(15, 18, 35, 0.28); display: grid; place-items: center; z-index: 20; padding: 16px; opacity: 0; pointer-events: none; transition: opacity .25s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet {
  width: 100%; max-width: 390px; max-height: calc(100% - 8px); overflow-y: auto; background: var(--card); border-radius: 26px; padding: 22px 20px 22px;
  box-shadow: 0 24px 60px rgba(15,18,35,.25); position: relative; transform: scale(.92); transition: transform .3s cubic-bezier(.2,1.4,.4,1);
}
.scrim.open .sheet { transform: scale(1); }
.step { display: flex; flex-direction: column; gap: 14px; }
.step[hidden] { display: none !important; }
.step.enter { animation: slidein .35s ease; }
@keyframes slidein { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
.close { position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: #f0f1f5; cursor: pointer; display: grid; place-items: center; color: var(--ink); z-index: 2; }
.close svg { width: 16px; height: 16px; }
.m-top { display: flex; align-items: center; gap: 14px; padding-right: 40px; margin-bottom: 12px; }
.m-top img { width: 84px; height: auto; mix-blend-mode: multiply; flex: none; }
.m-top .name { font-size: 1.1rem; flex-wrap: wrap; }
.label { font-size: 0.78rem; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.group { display: flex; flex-direction: column; gap: 8px; }

.select { position: relative; }
.select-btn { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--field); font: 700 1rem var(--font); color: var(--ink); cursor: pointer; }
.select.open .select-btn { border-color: var(--accent); }
.select-btn svg { width: 18px; height: 18px; transition: transform .2s; }
.select.open .select-btn svg { transform: rotate(180deg); }
.options { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 6px; list-style: none; margin: 0; z-index: 3; box-shadow: 0 14px 30px rgba(15,18,35,.16); }
.options li { padding: 12px 12px 12px 38px; border-radius: 10px; font-weight: 700; cursor: pointer; position: relative; font-variant-numeric: tabular-nums; }
.options li:hover, .options li.active { background: #eaf0ff; }
.options li[aria-selected="true"]::before { content: ""; position: absolute; left: 14px; top: 50%; width: 10px; height: 5px; border-left: 2.5px solid var(--accent); border-bottom: 2.5px solid var(--accent); transform: translateY(-70%) rotate(-45deg); }

.sims { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.sim { border: 2px solid var(--line); background: var(--card); border-radius: 14px; padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; font: 700 0.78rem var(--font); color: var(--ink); transition: border-color .2s, transform .15s, box-shadow .2s; min-width: 0; }
.sim svg { width: 30px; height: 38px; }
.sim[aria-pressed="true"] { border-color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent); }
.sim:active { transform: scale(.94); }

.field { width: 100%; padding: 15px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--field); font: 600 1rem var(--font); color: var(--ink); cursor: pointer; transition: border-color .2s, background .3s; }
.field::placeholder { color: #a3a6b1; }
.field.filled { animation: paste .45s ease; border-color: var(--accent); }
@keyframes paste { 0% { background: #dfe8ff; } 100% { background: var(--field); } }

.cta { margin-top: 2px; align-self: center; padding: 15px 46px; border-radius: 999px; border: 0; background: var(--ink); color: #fff; font: 700 1rem var(--font); cursor: pointer; transition: transform .15s, opacity .2s; }
.cta:active { transform: scale(.95); }

/* success */
.success { position: fixed; inset: 0; display: grid; place-items: center; z-index: 30; pointer-events: none; }
.tick { width: 150px; height: 150px; border-radius: 50%; background: var(--ok); display: grid; place-items: center; box-shadow: 0 16px 40px rgba(34,197,94,.45); transform: scale(0); opacity: 0; }
.tick svg { width: 76px; height: 76px; }
.tick path { stroke-dasharray: 60; stroke-dashoffset: 60; }
.success.show .tick { animation: pop .5s cubic-bezier(.2,1.6,.4,1) forwards; }
.success.show .tick path { animation: draw .45s ease .25s forwards; }
@keyframes pop { to { transform: scale(1); opacity: 1; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
canvas#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 29; }

.ripple { position: fixed; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; pointer-events: none; z-index: 40; background: rgba(60, 64, 80, .25); box-shadow: 0 0 0 2px rgba(255,255,255,.9); animation: rip .55s ease-out forwards; }
@keyframes rip { from { transform: scale(1); opacity: 1; } to { transform: scale(5); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .track, .sheet, .scrim, .shell > * { transition: none; } .ripple { display: none; } .step.enter { animation: none; } }
</style>
</head>
<body>


<div class="shell" id="shell">
  <header>
    <div class="logo"><i></i>PhoneStore</div>
    <div class="icons">
      <button class="icon-btn" aria-label="Account"><svg viewBox="0 0 24 24" fill="#2f6bff"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 21c.8-4.4 4.2-7 8.5-7s7.7 2.6 8.5 7z"/></svg></button>
      <button class="icon-btn" aria-label="Cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 3.5h3l2.4 11.2h10.4l2.2-8.2H6.6"/><circle cx="9.5" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg></button>
    </div>
  </header>
  <main>
    <div class="carousel">
      <button class="arrow prev" id="prev" aria-label="Previous phone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="frame"><div class="viewport" id="viewport"><div class="track" id="track"></div></div></div>
      <button class="arrow next" id="next" aria-label="Next phone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      <div class="dots" id="dots"></div>
    </div>
  </main>
</div>

<div class="scrim" id="scrim" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-name">
    <button class="close" id="close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="m-top"><img id="m-img" alt=""><div class="name" id="m-name"></div></div>

    <div class="step" id="step1">
      <div class="group">
        <span class="label" id="storage-label">Storage</span>
        <div class="select" id="select">
          <button class="select-btn" id="select-btn" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="storage-label select-btn"><span id="select-val">256 GB</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
          <ul class="options" id="options" role="listbox" hidden></ul>
        </div>
      </div>
      <div class="group">
        <span class="label">SIM</span>
        <div class="sims" id="sims"></div>
      </div>
      <button class="cta" id="continue">Continue</button>
    </div>

    <div class="step" id="step2" hidden>
      <input class="field" id="f-name" placeholder="Name" autocomplete="given-name" readonly>
      <input class="field" id="f-surname" placeholder="Surname" autocomplete="family-name" readonly>
      <input class="field" id="f-email" placeholder="Email" type="email" autocomplete="email" readonly>
      <button class="cta" id="learn">Learn more</button>
    </div>
  </div>
</div>

<canvas id="confetti"></canvas>
<div class="success" id="success"><div class="tick"><svg viewBox="0 0 52 52" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 27l9 9 18-19"/></svg></div></div>

  idx = (i + PHONES.length) % PHONES.length;
  track.style.transform = `translateX(${-idx * 100}%)`;
  [...dots.children].forEach((d, k) => d.setAttribute("aria-current", k === idx ? "true" : "false"));
}
document.getElementById("prev").onclick = () => go(idx - 1);
document.getElementById("next").onclick = () => go(idx + 1);
go(0);

let startX = null, dragMoved = false;
const vp = document.getElementById("viewport");
vp.addEventListener("pointerdown", e => { startX = e.clientX; dragMoved = false; });
vp.addEventListener("pointermove", e => {
  if (startX === null) return;
  const dx = e.clientX - startX;
  if (Math.abs(dx) > 8) { dragMoved = true; track.style.transition = "none"; track.style.transform = `translateX(calc(${-idx * 100}% + ${dx}px))`; }
});
function endDrag(e) {
  if (startX === null) return;
  const dx = e.clientX - startX; startX = null; track.style.transition = "";
  if (dragMoved && Math.abs(dx) > 50) go(idx + (dx < 0 ? 1 : -1)); else go(idx);
  setTimeout(() => { dragMoved = false; }, 30);
}
["pointerup", "pointercancel", "pointerleave"].forEach(ev => vp.addEventListener(ev, endDrag));

// sheet
const scrim = document.getElementById("scrim"), step1 = document.getElementById("step1"), step2 = document.getElementById("step2");
const sel = document.getElementById("select"), selBtn = document.getElementById("select-btn"), opts = document.getElementById("options"), selVal = document.getElementById("select-val");
const STORAGE = ["256 GB", "512 GB", "1 TB", "2 TB"];
let storage = STORAGE[0];
function renderOpts() {
  opts.innerHTML = "";
  STORAGE.forEach(s => {
    const li = document.createElement("li");
    li.textContent = s; li.setAttribute("role", "option"); li.setAttribute("aria-selected", s === storage ? "true" : "false");
    li.addEventListener("click", ev => { ev.stopPropagation(); li.classList.add("active"); storage = s; selVal.textContent = s; setTimeout(() => toggleSelect(false), 180); });
    opts.appendChild(li);
  });
}
function toggleSelect(open) { if (open) renderOpts(); opts.hidden = !open; sel.classList.toggle("open", open); selBtn.setAttribute("aria-expanded", open); }
selBtn.addEventListener("click", e => { e.stopPropagation(); toggleSelect(opts.hidden); });

const simsEl = document.getElementById("sims");
SIMS.forEach((s, i) => {
  const b = document.createElement("button");
  b.className = "sim"; b.style.setProperty("--c", s.c); b.setAttribute("aria-pressed", "false");
  b.innerHTML = `<svg viewBox="0 0 30 38" aria-hidden="true"><path d="M3 3h17l7 7v25H3z" fill="${s.c}" stroke="${s.c}" stroke-width="2" stroke-linejoin="round"/><rect x="8" y="15" width="14" height="13" rx="2.5" fill="#f4d27a"/><path d="M8 21.5h14M15 15v13" stroke="#c9a54a" stroke-width="1.3"/></svg>${s.name}`;
  b.addEventListener("click", () => [...simsEl.children].forEach((x, k) => x.setAttribute("aria-pressed", k === i ? "true" : "false")));
  simsEl.appendChild(b);
});

function showStep(n) {
  const [show, hide] = n === 1 ? [step1, step2] : [step2, step1];
  hide.hidden = true; show.hidden = false; show.classList.remove("enter"); void show.offsetWidth; show.classList.add("enter");
}
function openSheet(i) {
  const p = PHONES[i];
  document.getElementById("m-img").src = IMGS[i];
  document.getElementById("m-name").innerHTML = `<span class="dot" style="background:${p.color}"></span>${p.name}`;
  storage = STORAGE[0]; selVal.textContent = storage; toggleSelect(false);
  [...simsEl.children].forEach(x => x.setAttribute("aria-pressed", "false"));
  Object.keys(FORM).forEach(id => { const f = document.getElementById(id); f.value = ""; f.classList.remove("filled"); });
  showStep(1);
  scrim.classList.add("open"); scrim.setAttribute("aria-hidden", "false");
}
function closeSheet() { scrim.classList.remove("open"); scrim.setAttribute("aria-hidden", "true"); toggleSelect(false); }
document.getElementById("close").onclick = closeSheet;
scrim.addEventListener("click", e => { if (e.target === scrim) closeSheet(); else if (!sel.contains(e.target)) toggleSelect(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
document.getElementById("continue").onclick = () => showStep(2);

// one-tap fill
Object.entries(FORM).forEach(([id, val]) => {
  const f = document.getElementById(id);
  f.addEventListener("click", () => { f.value = val; f.classList.remove("filled"); void f.offsetWidth; f.classList.add("filled"); });
});

// finish
const shell = document.getElementById("shell"), success = document.getElementById("success");
let finished = false;
document.getElementById("learn").onclick = () => {
  closeSheet();
  setTimeout(() => { shell.classList.add("done"); success.classList.remove("show"); void success.offsetWidth; success.classList.add("show"); confetti(); finished = true; }, 250);
};
addEventListener("click", () => {
  if (!finished || parts.length) return;
  finished = false; success.classList.remove("show"); shell.classList.remove("done"); go(0);
});

const cv = document.getElementById("confetti"), ctx = cv.getContext("2d");
let parts = [], raf = null;
function size() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
addEventListener("resize", size); size();
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cols = ["#ff4d4d", "#ffbf26", "#22c55e", "#2f6bff", "#a855f7", "#ff5fb4", "#14d3e0"];
  const cx = innerWidth / 2, cy = innerHeight / 2;
  for (let i = 0; i < 170; i++) {
    const a = Math.random() * Math.PI * 2, sp = 4 + Math.random() * 11;
    parts.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 5, r: 3 + Math.random() * 4, c: cols[i % cols.length], sq: Math.random() < .35, rot: Math.random() * 6, life: 0 });
  }
  for (let i = 0; i < 120; i++) {
    parts.push({ x: Math.random() * innerWidth, y: -Math.random() * innerHeight * .6, vx: (Math.random() - .5) * 1.2, vy: 2 + Math.random() * 3, r: 3 + Math.random() * 3.5, c: cols[i % cols.length], sq: Math.random() < .35, rot: Math.random() * 6, life: 0, rain: true });
  }
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick() {
  const d = devicePixelRatio;
  ctx.clearRect(0, 0, cv.width, cv.height);
  parts = parts.filter(p => p.y < innerHeight + 20 && p.life < 300);
  for (const p of parts) {
    p.life++;
    if (!p.rain) { p.vx *= 0.97; p.vy = p.vy * 0.97 + 0.32; } else { p.x += Math.sin(p.life / 12 + p.rot) * .6; }
    p.x += p.vx; p.y += p.vy; p.rot += .15;
    ctx.globalAlpha = Math.max(0, 1 - Math.max(0, p.life - 240) / 60);
    ctx.fillStyle = p.c;
    if (p.sq) { ctx.save(); ctx.translate(p.x * d, p.y * d); ctx.rotate(p.rot); ctx.fillRect(-p.r * d, -p.r * .6 * d, p.r * 2 * d, p.r * 1.2 * d); ctx.restore(); }
    else { ctx.beginPath(); ctx.arc(p.x * d, p.y * d, p.r * d, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  raf = parts.length ? requestAnimationFrame(tick) : null;
  if (!raf) ctx.clearRect(0, 0, cv.width, cv.height);
}

addEventListener("pointerdown", e => {
  const r = document.createElement("span");
  r.className = "ripple"; r.style.left = e.clientX + "px"; r.style.top = e.clientY + "px";
  document.body.appendChild(r); setTimeout(() => r.remove(), 600);
});
</script>
